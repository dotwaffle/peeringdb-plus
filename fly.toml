# Fly.io deployment configuration for PeeringDB Plus
# Deploy manually with `fly deploy`.
# Two process groups: primary (lhr, volume) and replica (7 regions, no volume).

app = "peeringdb-plus"
primary_region = "lhr"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.prod"

[deploy]
  strategy = "rolling"
  # Parallelize rolling deploys to ~4-at-a-time (half the 8-machine fleet).
  # Trades ~55% worst-moment capacity for ~3-4x faster rollouts.
  # Bluegreen is NOT an option here: parallel fleets fight LiteFS +
  # Consul primary election.
  max_unavailable = 0.5

[env]
  PDBPLUS_LISTEN_ADDR = ":8080"
  PDBPLUS_DB_PATH = "/litefs/peeringdb-plus.db"
  PRIMARY_REGION = "lhr"

# Consul is required for LiteFS leader election.
[consul]
  enable = true

# Always restart crashed machines. Fly's default on-failure policy gives
# a bounded retry count, after which the machine is stopped and only
# traffic-driven auto_start might revive it — a transient crash loop on
# the LHR primary (e.g. OOM during a pathological catch-up sync; the
# documented pressure order ends in Fly OOM-kill) would otherwise halt
# sync until an operator intervenes, while replicas served increasingly
# stale data. With "always", the machine self-recovers and genuinely
# persistent failure still surfaces via the freshness/absence alerts.
[[restart]]
  policy = "always"

# Two process groups: primary (1 machine, LHR) and replica (7 machines).
# Both run `litefs mount` (the container ENTRYPOINT), not a separate binary.
# The command string here is informational; the image ENTRYPOINT wins at runtime.
# Fly docs state the command is passed to the Dockerfile entrypoint. Our
# ENTRYPOINT is ["litefs", "mount"] (see Dockerfile.prod), so both groups
# run the same image and entrypoint.
[processes]
  primary = ""
  replica = ""

# Persistent volume attached to the primary group ONLY.
# Replica machines get no mount — LiteFS cold-syncs the DB to ephemeral rootfs.
[[mounts]]
  source = "litefs_data"
  destination = "/var/lib/litefs"
  processes = ["primary"]
  initial_size = "1GB"
  scheduled_snapshots = false
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1G"
  auto_extend_size_limit = "10G"

# HTTP service serves traffic from BOTH groups (routed by Fly Proxy per region).
# Without `processes = [...]`, the service applies to all groups — explicit here
# for documentation.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["primary", "replica"]

  [http_service.http_options]
    h2_backend = true

  # Concurrency limits commented out 2026-04-28 to revert to Fly defaults
  # (type=requests, soft_limit=200, hard_limit=250). The previous
  # soft_limit=10 was conservative for the original shared-cpu-2x primary;
  # leave defaults in place so capacity testing reflects what real load
  # will see. Re-introduce explicit limits only if Fly Proxy queueing
  # behavior at default thresholds proves problematic.
  # [http_service.concurrency]
  #   type = "requests"
  #   soft_limit = 10

  # /readyz (not /healthz): the readiness probe returns 503 when the sync
  # data is stale or the newest sync failed, so Fly Proxy routes around a
  # machine that cannot serve fresh data. /healthz always returns 200.
  # During replica cold-sync hydration LiteFS has not started the app yet,
  # so the check fails until the app listens on :8080.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

# Primary group VM: shared-cpu-2x / 512 MB.
[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
  processes = ["primary"]

# Replica group VM: downsized to shared-cpu-1x / 256 MB.
# Observed replica RSS 58-59 MB → 256 MB gives ~4× headroom + hydration spike budget.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["replica"]
