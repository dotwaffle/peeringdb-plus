name: CI

# A single `ci` job runs generation, the go.mod tidiness check, build,
# race tests, lint, and govulncheck in order against one Go cache. Mise
# supplies every tool from the committed manifest and lockfile, so local
# and CI versions cannot drift.
#
# `docker-build` stays a separate parallel job: it uses BuildKit's
# `type=gha` cache (a different cache system from the Go build cache), so
# folding it into the Go job would only serialize it onto the critical
# path for zero cache benefit. It builds the standalone `Dockerfile` for
# linux/amd64 and linux/arm64 and the Fly-only `Dockerfile.prod` for
# linux/amd64, and pushes nothing.
#
# `docker-publish` runs on pushes only (main and `v*` tags), after `ci`
# and `docker-build` pass. It pushes the standalone image to
# ghcr.io/dotwaffle/peeringdb-plus with an SBOM, BuildKit provenance and
# a GitHub artifact attestation. `Dockerfile.prod` is never published:
# it needs the LiteFS lease of the Fly deployment.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Cancel an in-flight run for a PR ref when a new commit arrives. Main and
# tag pushes run to completion so every committed SHA keeps a full CI
# record and a started publish is never cut off. Each tag is its own ref,
# so a tag run never waits for or cancels a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          # mise.lock carries the exact Go version; go.sum carries the module
          # graph. Either changing invalidates the compiled cache.
          key: ${{ runner.os }}-go-${{ hashFiles('mise.lock') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('mise.lock') }}-

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.12
          install_args: --locked
          cache_key: mise-${{ runner.os }}-${{ runner.arch }}-{{version}}-{{file_hash}}

      - name: Check for generated code drift
        run: |
          mise run generate
          if ! git diff --exit-code -- ent/ gen/ graph/ internal/web/templates/ internal/web/static/tailwind.css internal/pdbcompat/allowlist_gen.go; then
            echo "::error::Generated code is out of date. Run 'mise run generate' and commit the changes."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- ent/ gen/ graph/ internal/web/templates/ internal/web/static/tailwind.css internal/pdbcompat/allowlist_gen.go)"
          if [[ -n "${untracked}" ]]; then
            printf '%s\n' "${untracked}"
            echo "::error::Generated code contains untracked files. Run 'mise run generate' and commit them."
            exit 1
          fi

      - name: Check go.mod/go.sum tidiness
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

      - name: Verify compilation
        run: mise run build

      - name: Run tests with race detector
        run: mise run test

      - name: Run golangci-lint
        run: mise run lint

      - name: Run govulncheck
        continue-on-error: true
        run: |
          if ! mise run vulncheck; then
            echo "::warning::govulncheck flagged at least one vulnerability — see step log for details"
            exit 1
          fi

      - name: Trim Go mod download zip cache before save
        if: always()
        run: |
          if [ -d "$HOME/go/pkg/mod/cache/download" ]; then
            find "$HOME/go/pkg/mod/cache/download" -name '*.zip' -delete
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-26.04
    # Least privilege: the job only checks out and builds (push: false).
    # Without this it inherits the repository default token scope.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # One gha cache scope per Dockerfile, so the two builds stop
      # overwriting one cache entry. The build stage cross-compiles, so the
      # arm64 build needs no QEMU.
      - name: Build standalone image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  docker-publish:
    name: Docker Publish
    if: github.event_name == 'push'
    needs: [ci, docker-build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      # Full history and tags: the Dockerfile stamps the binary with
      # `git describe --tags`.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag vX.Y.Z gives X.Y.Z, X.Y and latest (flavor
      # latest=auto adds latest through the semver rules, and skips it for
      # a pre-release). A main push gives main. Every push gives sha-<short>.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha

      # cache-from only: docker-build owns the dev scope, and a second
      # writer would race it.
      - name: Build and push standalone image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev

      # With no predicate or SBOM input, actions/attest makes a SLSA build
      # provenance attestation. Storage records need artifact-metadata:
      # write and an organization-owned repository, so they stay off.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
