name: CI

# A single `ci` job runs generation, the go.mod tidiness check, build,
# race tests, lint, and govulncheck in order against one Go cache. Mise
# supplies every tool from the committed manifest and lockfile, so local
# and CI versions cannot drift.
#
# `docker-build` runs on pull requests only, as a separate job in parallel
# with `ci`: it uses BuildKit's `type=gha` cache (a different cache system
# from the Go build cache), so folding it into the Go job would only
# serialize it onto the critical path. It builds the standalone
# `Dockerfile` for linux/amd64 and linux/arm64 and the Fly-only
# `Dockerfile.litefs` for linux/amd64, and pushes nothing.
#
# `docker-publish` runs on pushes only (main and `v*` tags). It builds the
# standalone image once and pushes it to ghcr.io/dotwaffle/peeringdb-plus
# with an SBOM, BuildKit provenance and a GitHub artifact attestation. A
# push does not also run `docker-build`: publish checks out the full
# history, so that `go build` can stamp the version from the tags. Its
# build context and version string thus differ from a shallow checkout,
# and it could not reuse the layers of a second build. `Dockerfile.litefs`
# is never published: it needs the LiteFS lease of the Fly deployment,
# and `fly deploy` builds it.
#
# A `v*` tag push does not run `ci`. A release tag points to a commit
# that a push to main already tested, so a second `ci` run would repeat
# the same work. On a main push, `docker-publish` waits for `ci` to pass.
# On a tag push, its first step waits until the tagged commit has a
# successful `CI` job in a run of this workflow for a push to main. The
# step fails when that job did not pass, or when no such job completes
# within 30 minutes. The tag run still builds its own image, because `go build`
# stamps the tag as the version and the main image can carry a Go
# pseudo-version.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Cancel an in-flight run for a PR ref when a new commit arrives. Main and
# tag pushes run to completion so every committed SHA keeps a full CI
# record and a started publish is never cut off. Each tag is its own ref,
# so a tag run never waits for or cancels a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    # A tag push reuses the result of the main push for the same commit.
    # See the gate step in docker-publish.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The cache is restored before mise installs the tools, because mise
      # builds the go: tools (gqlgen, templ, protoc plugins) with it. So the
      # Go version comes from mise.lock, not from the installed toolchain.
      - name: Read Go version
        id: go
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mise.lock", "rb"))["tools"]["go"][0]["version"])')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          # The build cache belongs to one Go version, and go.sum carries the
          # module graph. Other tool versions in mise.lock stay out of the
          # key: golangci-lint salts its cache with its own version.
          key: ${{ runner.os }}-go${{ steps.go.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ steps.go.outputs.version }}-

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.12
          install_args: --locked
          cache_key: mise-${{ runner.os }}-${{ runner.arch }}-{{version}}-{{file_hash}}

      - name: Check for generated code drift
        run: |
          mise run generate
          if ! git diff --exit-code -- ent/ gen/ graph/ internal/web/templates/ internal/web/static/tailwind.css internal/pdbcompat/allowlist_gen.go; then
            echo "::error::Generated code is out of date. Run 'mise run generate' and commit the changes."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- ent/ gen/ graph/ internal/web/templates/ internal/web/static/tailwind.css internal/pdbcompat/allowlist_gen.go)"
          if [[ -n "${untracked}" ]]; then
            printf '%s\n' "${untracked}"
            echo "::error::Generated code contains untracked files. Run 'mise run generate' and commit them."
            exit 1
          fi

      - name: Check go.mod/go.sum tidiness
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

      - name: Verify compilation
        run: mise run build

      - name: Run tests with race detector
        run: mise run test

      - name: Run golangci-lint
        run: mise run lint

      - name: Run govulncheck
        continue-on-error: true
        run: |
          if ! mise run vulncheck; then
            echo "::warning::govulncheck flagged at least one vulnerability — see step log for details"
            exit 1
          fi

      - name: Trim Go mod download zip cache before save
        if: always()
        run: |
          if [ -d "$HOME/go/pkg/mod/cache/download" ]; then
            find "$HOME/go/pkg/mod/cache/download" -name '*.zip' -delete
          fi

  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Least privilege: the job only checks out and builds (push: false).
    # Without this it inherits the repository default token scope.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # One gha cache scope per Dockerfile, so the two builds stop
      # overwriting one cache entry. A pull request run reads the caches of
      # its own ref and of main, and writes only its own. On main,
      # docker-publish writes the dev scope. The build stage cross-compiles,
      # so the arm64 build needs no QEMU.
      - name: Build standalone image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.litefs
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  docker-publish:
    name: Docker Publish
    # A skipped need skips this job unless the condition calls a status
    # function, so `!cancelled()` is necessary. A main push needs a
    # successful `ci`. A tag push skips `ci` and runs the gate step below.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
      (needs.ci.result == 'success' ||
      (github.ref_type == 'tag' && needs.ci.result == 'skipped')) }}
    needs: [ci]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # read the CI result of the main push in the tag gate
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      # A tag push does not run `ci`. Publish only when a run of this
      # workflow for a push to main has a successful `CI` job for the
      # tagged commit. Main and the tag can be pushed together, so the
      # step waits while that run is not registered yet or its `CI` job
      # has not completed.
      - name: Require CI success on main for the tagged commit
        if: github.ref_type == 'tag'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          WAIT_SECONDS: 1800
          POLL_SECONDS: 30
        run: |
          set -euo pipefail

          # Verdict for one run: success, pending, or the reason that the
          # run did not pass. GitHub can list a new run before it creates
          # its jobs, so a missing CI job in an unfinished run is pending.
          # shellcheck disable=SC2016 # $ci is a jq variable, not a shell one.
          verdict_jq='
            [(.jobs // [])[] | select(.name == "CI")] as $ci
            | if any($ci[]; .conclusion == "success") then "success"
              elif .status != "completed" or any($ci[]; .status != "completed") then "pending"
              elif ($ci | length) == 0 then "no CI job"
              else "CI job " + ($ci | map(.conclusion) | join(","))
              end'

          deadline=$((SECONDS + WAIT_SECONDS))
          while true; do
            runs="$(gh run list --repo "$REPO" --workflow ci.yml \
              --commit "$SHA" --branch main --event push --limit 50 \
              --json databaseId --jq '.[].databaseId')"

            pending=0
            if [[ -z "$runs" ]]; then
              echo "No run for a push to main has tested $SHA yet."
              pending=1
            fi
            for run in $runs; do
              verdict="$(gh run view "$run" --repo "$REPO" \
                --json status,jobs --jq "$verdict_jq")"
              case "$verdict" in
                success)
                  echo "Run $run for a push to main passed CI for $SHA. Publishing $TAG."
                  exit 0
                  ;;
                pending)
                  echo "Run $run for a push to main has not completed CI for $SHA."
                  pending=1
                  ;;
                *)
                  echo "Run $run for a push to main did not pass: $verdict."
                  ;;
              esac
            done

            if [[ "$pending" -eq 0 ]]; then
              echo "::error::$TAG points to $SHA, which did not pass CI in a push to main. Tag a commit that CI tested in a push to main, for example the tip of a push. After a successful re-run of that CI job, re-run this job."
              exit 1
            fi
            if [[ "$SECONDS" -ge "$deadline" ]]; then
              echo "::error::No completed CI job for $SHA in a push to main after $WAIT_SECONDS seconds. Tag a commit that CI tested in a push to main, for example the tip of a push. If that CI job is still in progress, re-run this job after it passes."
              exit 1
            fi
            echo "Waiting $POLL_SECONDS seconds."
            sleep "$POLL_SECONDS"
          done

      # Full history and tags: `go build` stamps the version from the
      # nearest tag (Go 1.24 and later).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag vX.Y.Z gives X.Y.Z, X.Y and latest (flavor
      # latest=auto adds latest through the semver rules, and skips it for
      # a pre-release). A main push gives main and sha-<short>. A tag run
      # does not push sha-<short>: the main run for the same commit pushes
      # it, and two pushes of one tag leave the digest of the later one.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      # docker-build does not run on a push, so this job is the only writer
      # of the dev scope on main. Pull request builds read it. A tag run
      # reads it too but writes nothing: a cache saved on a tag ref can be
      # restored only by that same tag, so no later run could use it.
      - name: Build and push standalone image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dev
          cache-to: ${{ github.ref_type == 'branch' && 'type=gha,mode=max,scope=dev' || '' }}

      # With no predicate or SBOM input, actions/attest makes a SLSA build
      # provenance attestation. Storage records need artifact-metadata:
      # write and an organization-owned repository, so they stay off.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
