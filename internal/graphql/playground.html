    <div id="graphiql">Loading...</div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { GraphiQL } from 'graphiql';
      import { createGraphiQLFetcher } from '@graphiql/toolkit';

      // Workers and their dependencies are embedded in the Go binary.
      globalThis.MonacoEnvironment = {
        getWorker(_workerId, label) {
          const workers = {"editor": "e8425f059c96b044.mjs", "json": "07aa32f158d0c602.mjs", "graphql": "06969fae109476d4.mjs"};
          const name = workers[label] || workers.editor;
          return new Worker('/graphql/assets/' + name, { type: 'module', name: label });
        },
      };

      const url = new URL({{.Endpoint}}, location.origin).href;
      const fetcher = createGraphiQLFetcher({ url });
      createRoot(document.getElementById('graphiql')).render(
        React.createElement(GraphiQL, {
          fetcher,
          defaultQuery: {{.DefaultQuery}},
          shouldPersistHeaders: true,
        }),
      );
    </script>
