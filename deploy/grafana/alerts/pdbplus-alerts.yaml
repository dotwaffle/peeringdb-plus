# PeeringDB Plus: Grafana Cloud alert rules.
# Production runs these as Grafana-managed rules with the same names and
# expressions. See deploy/grafana/alerts/README.md for the apply and lint
# workflow. Do not also load this file into the Mimir ruler.
#
# Grafana notification policies route the alerts by the severity label.
#
# DO NOT add email addresses, hosted Grafana Cloud stack URLs, or tenant
# identifiers to this file. See README.md "Forbidden content" for the rationale.

groups:
  - name: pdbplus-critical
    interval: 1m
    rules:
      - alert: PdbPlusSyncFreshnessHigh
        expr: max(pdbplus_sync_freshness_seconds) > 7200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus sync data is stale (>2h)"
          description: |
            max(pdbplus_sync_freshness_seconds) has exceeded 7200s (2h)
            for 5m, which is 8× the 15-minute authenticated sync cadence.
            Replicas serve stale data — check primary sync worker logs and
            PeeringDB upstream availability.

      - alert: PdbPlusSyncFailureRateHigh
        expr: |
          sum(rate(pdbplus_sync_operations_total{status="failed"}[15m]))
            /
          clamp_min(sum(rate(pdbplus_sync_operations_total[15m])), 1e-9)
            > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus sync keeps failing (retries exhausted)"
          description: |
            More than half of the sync attempts in the last 15 minutes
            failed, for 15 minutes. A failure that the 30s retry recovers
            gives a ratio of 0.5 and does not fire, so in practice this
            fires when the 30s/2m/8m retries of a cycle all fail and the
            failures continue into the next window. Check "sync cycle
            failed" in the primary logs and PeeringDB upstream
            availability. The clamp_min guards divide-by-zero on quiet
            windows.

      - alert: PdbPlusFleetMachineCountLow
        expr: |
          count(
            count by (service_namespace, cloud_region) (
              go_memory_used_bytes{service_name="peeringdb-plus"}
            )
          ) < 6
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus fleet machine count <6 (expected 8)"
          description: |
            Counted distinct (service_namespace, cloud_region) pairs reporting
            go_memory_used_bytes for service_name=peeringdb-plus is below 6
            for 10m. Expected fleet is 8 machines (1 primary LHR + 7
            replicas). Check Fly machine status: fly status -a peeringdb-plus.

      - alert: PdbPlusTelemetryAbsent
        expr: absent(go_memory_used_bytes{service_name="peeringdb-plus"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus telemetry has stopped arriving entirely"
          description: |
            absent(go_memory_used_bytes{service_name="peeringdb-plus"})
            has been true for 10m: not a single machine is exporting the
            OTel runtime metrics that every other rule in this file keys
            on. Every other alert silently stops evaluating in this state
            (empty vectors fire nothing), so this meta-rule is the only
            signal for a broken export pipeline — rotated OTLP
            credentials, exporter misconfiguration on deploy, Grafana
            Cloud ingest outage — or a whole-fleet outage. Check
            fly status -a peeringdb-plus first to split the two.

      - alert: PdbPlusPrimaryAbsent
        expr: absent(go_memory_used_bytes{service_name="peeringdb-plus", service_namespace="primary"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus primary machine is not reporting"
          description: |
            No series with service_namespace="primary" for 10m. The
            primary is the fleet's single stateful machine (LHR volume)
            and the only sync writer: with it down, replicas keep serving
            but data freshness degrades until PdbPlusSyncFreshnessHigh
            fires at 2h — this rule exists to cut that detection gap to
            10m. Note PdbPlusFleetMachineCountLow triggers at <6 of 8, so
            losing exactly the primary does not trip it. If
            PdbPlusTelemetryAbsent is firing too, suspect the export
            pipeline rather than the machine. Check:
            fly status -a peeringdb-plus.

  - name: pdbplus-warning
    interval: 1m
    rules:
      - alert: PdbPlusHeapHigh
        expr: max(pdbplus_sync_peak_heap_bytes) > 419430400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus peak Go heap >400 MiB sustained 30m"
          description: |
            max(pdbplus_sync_peak_heap_bytes) has been above 419430400 bytes
            (400 MiB) for 30m. Sustained high heap should re-open the
            incremental-sync evaluation — surface at next milestone planning.
            Observed baseline 2026-04-17 was 83.8 MiB primary, 58-59 MiB
            replicas.

      - alert: PdbPlusRssHigh
        expr: max(pdbplus_sync_peak_rss_bytes) > 402653184
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus peak OS RSS >384 MiB sustained 30m"
          description: |
            max(pdbplus_sync_peak_rss_bytes) has been above 402653184 bytes
            (384 MiB) for 30m. The gauge is the peak RSS of the last sync
            cycle (VmHWM, reset at the start of each cycle), so 30m is at
            least two cycles. Approaching the Fly 512 MB VM cap; expected
            failure order is log, then app crash, then Fly OOM-kill.

      - alert: PdbPlusSyncOperationFailed
        expr: sum(increase(pdbplus_sync_operations_total{status="failed"}[3h])) > 1.5
        for: 5m
        keep_firing_for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus had at least 2 failed sync attempts in 3h"
          description: |
            sum(increase(pdbplus_sync_operations_total{status="failed"}[3h]))
            > 1.5: at least two sync attempts failed in the last 3 hours.
            The counter counts attempts, so a failure that the 30s retry
            recovered counts once, and a single upstream blip does not
            fire. The failures do not need to be consecutive. keep_firing_for
            holds the alert for 1h after the count drops below 2, so
            failures that recur every few hours stay one alert. Check
            "sync cycle failed" and "sync failed, retrying" in the primary
            logs.
