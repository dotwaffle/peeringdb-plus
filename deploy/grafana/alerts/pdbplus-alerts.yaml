# PeeringDB Plus: Grafana Cloud alert rules.
# Production runs these as Grafana-managed rules with the same names and
# expressions. See deploy/grafana/alerts/README.md for the apply and lint
# workflow. Do not also load this file into the Mimir ruler.
#
# Grafana notification policies route the alerts by the severity label.
#
# DO NOT add email addresses, hosted Grafana Cloud stack URLs, or tenant
# identifiers to this file. See README.md "Forbidden content" for the rationale.

groups:
  - name: pdbplus-critical
    interval: 1m
    rules:
      - alert: PdbPlusSyncFreshnessHigh
        expr: max(pdbplus_sync_freshness_seconds) > 7200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus sync data is stale (>2h)"
          description: |
            max(pdbplus_sync_freshness_seconds) has exceeded 7200s (2h)
            for 5m, which is 8× the 15-minute authenticated sync cadence.
            Replicas serve stale data — check primary sync worker logs and
            PeeringDB upstream availability.

      - alert: PdbPlusSyncFailureRateHigh
        expr: |
          sum(rate(pdbplus_sync_operations_total{status="failed"}[15m]))
            /
          clamp_min(sum(rate(pdbplus_sync_operations_total[15m])), 1e-9)
            > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus sync keeps failing (retries exhausted)"
          description: |
            More than half of the sync attempts in the last 15 minutes
            failed, for 15 minutes. A failure that the 30s retry recovers
            gives a ratio of 0.5 and does not fire, so in practice this
            fires when the 30s/2m/8m retries of a cycle all fail and the
            failures continue into the next window. Check "sync cycle
            failed" in the primary logs and PeeringDB upstream
            availability. The clamp_min guards divide-by-zero on quiet
            windows.

      - alert: PdbPlusFleetMachineCountLow
        expr: |
          count(
            count by (service_namespace, cloud_region) (
              go_memory_used_bytes{service_name="peeringdb-plus"}
            )
          ) < 6
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus fleet machine count <6 (expected 8)"
          description: |
            Counted distinct (service_namespace, cloud_region) pairs reporting
            go_memory_used_bytes for service_name=peeringdb-plus is below 6
            for 10m. Expected fleet is 8 machines (1 primary LHR + 7
            replicas). Check Fly machine status: fly status -a peeringdb-plus.

      - alert: PdbPlusTelemetryAbsent
        expr: absent(go_memory_used_bytes{service_name="peeringdb-plus"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus telemetry has stopped arriving entirely"
          description: |
            absent(go_memory_used_bytes{service_name="peeringdb-plus"})
            has been true for 10m: not a single machine is exporting the
            OTel runtime metrics that every other rule in this file keys
            on. Every other alert silently stops evaluating in this state
            (empty vectors fire nothing), so this meta-rule is the only
            signal for a broken export pipeline — rotated OTLP
            credentials, exporter misconfiguration on deploy, Grafana
            Cloud ingest outage — or a whole-fleet outage. Check
            fly status -a peeringdb-plus first to split the two.

      - alert: PdbPlusPrimaryAbsent
        expr: absent(go_memory_used_bytes{service_name="peeringdb-plus", service_namespace="primary"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus primary machine is not reporting"
          description: |
            No series with service_namespace="primary" for 10m. The
            primary is the fleet's single stateful machine (LHR volume)
            and the only sync writer: with it down, replicas keep serving
            but data freshness degrades until PdbPlusSyncFreshnessHigh
            fires at 2h — this rule exists to cut that detection gap to
            10m. Note PdbPlusFleetMachineCountLow triggers at <6 of 8, so
            losing exactly the primary does not trip it. If
            PdbPlusTelemetryAbsent is firing too, suspect the export
            pipeline rather than the machine. Check:
            fly status -a peeringdb-plus.

      - alert: PdbPlusProbeFailing
        expr: |
          count(
            sum by (probe) (increase(probe_all_success_sum{job="peeringdb-plus-api"}[15m]))
              /
            sum by (probe) (increase(probe_all_success_count{job="peeringdb-plus-api"}[15m]))
              < 0.5
          ) >= 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PeeringDB Plus /api check fails from 2 or more probe locations"
          description: |
            The Synthetic Monitoring check peeringdb-plus-api
            (deploy/grafana/synthetics/README.md) failed more than half of
            its executions in the last 15m (3 executions at the 5m
            frequency) from at least 2 probe locations, for 5m
            (probe_all_success_sum / probe_all_success_count). The
            check requests /api through the public hostname, so this covers
            DNS, TLS and the Fly proxy, which the fleet metrics cannot see.
            One failing location does not fire. Open the check in the
            Synthetic Monitoring app for the failing phase, then run
            fly status -a peeringdb-plus. No data (the check does not exist)
            is OK.

  - name: pdbplus-warning
    interval: 1m
    rules:
      - alert: PdbPlusHeapHigh
        expr: max(pdbplus_sync_peak_heap_bytes) > 419430400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus peak Go heap >400 MiB sustained 30m"
          description: |
            max(pdbplus_sync_peak_heap_bytes) has been above 419430400 bytes
            (400 MiB) for 30m. Sustained high heap should re-open the
            incremental-sync evaluation — surface at next milestone planning.
            Observed baseline 2026-04-17 was 83.8 MiB primary, 58-59 MiB
            replicas.

      - alert: PdbPlusRssHigh
        expr: max(pdbplus_sync_peak_rss_bytes) > 402653184
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus peak OS RSS >384 MiB sustained 30m"
          description: |
            max(pdbplus_sync_peak_rss_bytes) has been above 402653184 bytes
            (384 MiB) for 30m. The gauge is the peak RSS of the last sync
            cycle (VmHWM, reset at the start of each cycle), so 30m is at
            least two cycles. Approaching the Fly 512 MB VM cap; expected
            failure order is log, then app crash, then Fly OOM-kill.

      - alert: PdbPlusReplicaMemoryHigh
        expr: sum by (cloud_region) (go_memory_used_bytes{service_name="peeringdb-plus", service_namespace="replica"}) > 188743680
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus replica Go memory >180 MiB sustained 15m"
          description: |
            The Go runtime memory of the replica in {{ $labels.cloud_region }}
            has been above 188743680 bytes (180 MiB) for 15m. Replicas run
            on 256 MB VMs and do not sync, so the heap and RSS rules (which
            read the sync-cycle gauges of the primary) do not cover them.
            Baseline in the week to 2026-09-25: about 20 MB at rest, peaks
            near 105 MB. A sustained rise points at large API responses
            (Response Heap Delta panel) or a leak. An OOM kill restarts the
            machine, which then copies the whole database from the primary
            again.

      - alert: PdbPlusReplicaLagHigh
        expr: max by (cloud_region) (pdbplus_litefs_lag_seconds{service_name="peeringdb-plus", service_namespace="replica"}) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus replica gets no LiteFS frames for >10 min"
          description: |
            The replica in {{ $labels.cloud_region }} has received no LiteFS
            frame (LTX file or heartbeat) from the primary for more than 600
            seconds (pdbplus_litefs_lag_seconds), for 10m. It serves the data
            of its last applied transaction. The 7-day maximum to 2026-09-25
            was 30 seconds. If PdbPlusPrimaryAbsent fires too, fix the
            primary first. Else read the LiteFS lines of that machine in
            fly logs; a replica is recovered by destroying and recreating
            it.

      - alert: PdbPlusPrimaryVolumeLow
        expr: min(pdbplus_scratch_free_bytes{service_name="peeringdb-plus", service_namespace="primary"}) < 536870912
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus primary volume has <512 MiB free for 30m"
          description: |
            pdbplus_scratch_free_bytes on the primary has been below
            536870912 bytes (512 MiB) for 30m. It is the free space of the
            file system of PDBPLUS_SCRATCH_DIR, the LiteFS volume that also
            holds the database and its LTX files. Below 512 MiB each sync
            cycle stages its scratch file in the temp dir of the rootfs
            (WARN "scratch dir low on free space, staging in the temp
            dir"), and a full volume stops the LiteFS writes. Extend the
            volume: fly volumes list -a peeringdb-plus, then
            fly volumes extend <id> -s <GB> -a peeringdb-plus.

      - alert: PdbPlusSyncOperationFailed
        expr: sum(increase(pdbplus_sync_operations_total{status="failed"}[3h])) > 1.5
        for: 5m
        keep_firing_for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus had at least 2 failed sync attempts in 3h"
          description: |
            sum(increase(pdbplus_sync_operations_total{status="failed"}[3h]))
            > 1.5: at least two sync attempts failed in the last 3 hours.
            The counter counts attempts, so a failure that the 30s retry
            recovered counts once, and a single upstream blip does not
            fire. The failures do not need to be consecutive. keep_firing_for
            holds the alert for 1h after the count drops below 2, so
            failures that recur every few hours stay one alert. Check
            "sync cycle failed" and "sync failed, retrying" in the primary
            logs.

  # The rules of this group query the Fly.io managed Prometheus (the
  # Grafana data source "fly.io"), not the Prometheus of the stack. See
  # README.md "Fly.io rules".
  - name: pdbplus-fly
    interval: 1m
    rules:
      - alert: PdbPlusMachineOOMKilled
        expr: |
          max by (region, instance) (fly_instance_exit_oom{app="peeringdb-plus"})
            and on (region, instance)
          max by (region, instance) (resets(fly_instance_cpu{app="peeringdb-plus"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus machine restarted after an out-of-memory kill"
          description: |
            The machine {{ $labels.instance }} in {{ $labels.region }}
            restarted in the last 15m (its fly_instance_cpu counters reset),
            and Fly.io reports that its last exit was an out-of-memory kill
            (fly_instance_exit_oom = 1). The app cannot report its own OOM
            kill. After a restart a replica copies the whole database from
            the primary again. Check the VM Memory Available panel and
            fly logs -a peeringdb-plus for the machine. The alert resolves
            15m after the restart.

      - alert: PdbPlusMachineCPUThrottled
        expr: max by (region) (rate(fly_instance_cpu_throttle{app="peeringdb-plus"}[5m])) / 100 > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PeeringDB Plus machine CPU throttled >1% for 15m"
          description: |
            The cgroup of the machine in {{ $labels.region }} was throttled
            for more than 1% of the time in each 5m window, for 15m
            (fly_instance_cpu_throttle, in centiseconds). A shared-CPU machine
            that has spent its burst balance runs at its baseline (1/16 of a
            vCPU on a replica, 1/8 on the primary), and requests wait for
            CPU. Check the CPU panels of the Fly Platform row of the
            dashboard. A machine that stays throttled needs a larger CPU kind
            (fly.toml [[vm]]).
