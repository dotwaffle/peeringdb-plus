# rumdl configuration: https://rumdl.dev
#
# Prose uses one sentence per source line: MD013's reflow rewraps at
# sentence boundaries so a prose edit produces a line-scoped diff.

[global]
# .claude holds local agent settings that the repository does not track.
exclude = [
  ".claude",
  # Golden fixtures compared byte-for-byte by tests; reflow would break
  # the comparison.
  "internal/visbaseline/testdata/diff_golden",
  "testdata/visibility-baseline",
]
respect-gitignore = true
# Do not write a cache directory into the repository.
cache = false

[MD013]
reflow = true
reflow-mode = "sentence-per-line"
# A large limit turns off wrapping at a column width. Only sentence ends
# break lines, and a long sentence stays on one line.
line-length = 100000
